[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "augmentrum"
version = "0.0.2"
description = "A Data Augmentation Package for MR Spectroscopy"
readme = "README.md"
authors = [
    {name = "John T. LaMaster", email = "jlamaste@gmail.com"},
    {name = "Julian P. Merkofer", email = "j.p.merkofer@tue.nl"},
    {name = "Kay C. Igwe", email = "kci2104@columbia.edu"},
]
license = {text = "Apache-2.0"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Physics",
]
keywords = ["MRS", "spectroscopy", "data augmentation", "medical imaging", "machine learning"]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "torch>=1.10.0",
    "fsl-mrs>=2.1.0",
    "nifti-mrs>=0.1.0",
    "spec2nii>=0.6.0",
    "torchkbnufft>=1.3.0",
    "tqdm>=4.62.0",
    "matplotlib>=3.4.0",
    "shutup>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "pytest-mock>=3.10.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
]
jax = [
    "jax>=0.4.0",
    "jaxlib>=0.4.0",
]
keras = [
    "keras>=3.0.0",
]
all = [
    "tensorflow>=2.8.0",
    "keras>=3.0.0",
    "jax>=0.4.0",
    "jaxlib>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/julianmer/Augmentrum"
Documentation = "https://github.com/julianmer/Augmentrum#readme"
Repository = "https://github.com/julianmer/Augmentrum"
"Bug Tracker" = "https://github.com/julianmer/Augmentrum/issues"

[tool.setuptools]
packages = [
    "augmentrum",
    "augmentrum.core",
    "augmentrum.augmentation",
    "augmentrum.dataset",
    "augmentrum.processing",
    "augmentrum.sampling",
    "augmentrum.utils",
]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::RuntimeWarning",
    "ignore::UserWarning",
]
